# Development config for the recommended architecture (SPEC 9 schema).
# Owner: model-core (model block) / trainer (optim, train blocks) / data-pipeline (data block).
#
# The `model` block is the only thing src/model.py:build_model() reads; it also tolerates
# being handed this whole mapping and will pick out `model` itself. Every key is optional
# and falls back to a documented default in src/model.py:_DEFAULTS, so an old checkpoint
# config always loads (V35).
#
# MEASURED cost of this model block (src/model.py self-test, `py -3.12 -m src.model`):
#   params 388,225 (0.388 M)   MACs @128x128 = 5.584 G   FLOPs ~= 11.17 G per image
# Scale-up options, measured, if a quality/throughput trade proves worth it:
#   w56 n16 0.523 M / 15.1 GF | w64 n16 0.678 M / 19.6 GF | w80 n16 1.049 M / 30.4 GF
#   w64 n28 1.048 M / 29.7 GF | w96 n16 1.500 M / 43.6 GF
# SPEC 7.1 quotes a 1-3 M budget while SPEC 9 quotes width 48 / 16 blocks, which is
# 0.388 M. SPEC 9's concrete numbers are kept as the default: a size change must be
# justified by a measured quality delta, not by matching a stated band (docs/decisions.md).
model:
  name: NAFSR
  width: 48
  num_blocks: 16
  scale: 2                # F2: exactly x2, verified on all 3200 pairs
  in_ch: 1                # grayscale end to end, no BGR/RGB anywhere (V32)
  out_ch: 1
  dw_expand: 2            # NAFBlock spatial-branch expansion
  ffn_expand: 2           # NAFBlock channel-MLP expansion
  layerscale_init: 1.0    # official NAFNet uses 0.0; 1.0 converges faster on a 20k budget
data:
  lr_patch: 64            # -> 128 GT patch
  batch_size: 32
  synth_ratio: 0.5        # fraction generated on the fly from GT (SPEC F15)
  # Degradation params are MEASURED, not from SPEC 6.4. See docs/decisions.md D12.
  degrade:
    kernel: recovered_4x4       # bicubic_aa_off used for a minority of samples
    bicubic_alt_prob: 0.25
    noise_after_downsample: true
    a: 0.011253                 # shot / linear term
    v: 0.015745                 # speckle / quadratic term
    randomise_frac: 0.30        # +/-30% on a and v
    gauss_sigma_range: [0.0, 0.02]   # includes zero; hedge for SPEC F3
    clip_lr: false              # SPEC F5 -- never clip synthetic LR
optim:
  optimizer: AdamW
  lr: 1.0e-3
  betas: [0.9, 0.9]       # NAFNet beta2=0.9, not 0.999
  weight_decay: 0.0
  scheduler: cosine
  min_lr: 1.0e-6
  warmup_iters: 500
  total_iters: 20000      # compressed for a 1-day budget
train:
  amp: bf16
  grad_clip: 1.0
  ema_decay: 0.999
  seed: 42
  channels_last: true
  val_every: 1000
  save_best_on: psnr
