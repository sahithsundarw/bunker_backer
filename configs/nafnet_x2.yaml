# Development config for the recommended architecture (SPEC 9 schema).
# Owner: model-core (model block) / trainer (optim, train blocks) / data-pipeline (data block).
#
# The `model` block is the only thing src/model.py:build_model() reads; it also tolerates
# being handed this whole mapping and will pick out `model` itself. Every key is optional
# and falls back to a documented default in src/model.py:_DEFAULTS, so an old checkpoint
# config always loads (V35).
#
# MEASURED cost of this model block (src/model.py self-test, `py -3.12 -m src.model`):
#   params 388,225 (0.388 M)   MACs @128x128 = 5.584 G   FLOPs ~= 11.17 G per image
#
# WHY WIDTH 48 AND NOT THE 1-3 M BAND SPEC 7.1 QUOTES.
# SPEC 7.1 quotes a 1-3 M parameter budget; SPEC 9 quotes width 48 / 16 blocks, which
# measures 0.388 M. SPEC 9's concrete numbers win, and the reason is the *training* cost
# on the available hardware, not the inference cost. Measured on an RTX 4060 Laptop GPU
# (8 GB), bf16 + channels_last, 400 images at 128x128 batch 16, and a train step at
# batch 32 / 64x64 patches:
#
#   config    params   400 img    train step   20k iters   peak VRAM
#   w48 n16   0.388 M   4618 ms      221 ms      73.7 min    3765 MiB   <- default
#   w64 n16   0.678 M   5289 ms      261 ms      87.1 min    5010 MiB
#   w80 n16   1.049 M   6452 ms      407 ms     135.5 min    6255 MiB
#   w96 n16   1.500 M   7446 ms      423 ms     141.1 min    6975 MiB
#   w64 n28   1.048 M   9021 ms     2766 ms     922.0 min    7925 MiB   <- thrashing
#
# Entering the 1-3 M band costs 1.8x-1.9x the training wall-clock for an UNMEASURED
# quality gain, and w64 n28 does not fit the card (peak 7925 MiB of 8 GB; the 12.5x step
# time is allocator spill, not compute). With a one-day budget the deciding factor is how
# many training runs fit, so the default stays at 0.388 M until a quality delta is
# actually measured. Raising width is the first thing to try if time allows.
#
# CAVEATS ON THE INFERENCE COLUMN, so nobody over-reads it:
#  - Single-shot measurements with ~9% run-to-run variance. The w48 n16 figure re-measured
#    as a median of 5 interleaved repeats is 4233 ms (range 4196-4329). Treat the column
#    as ranking the configs, not as precise per-config timings.
#  - These are RTX 4060 numbers. The model is memory-bandwidth bound, not compute bound
#    (profile: 32.8% layer_norm, 17.9% conv bias-add, 16.2% convolution).
#  - KLA scores on an H100 with roughly an order of magnitude more bandwidth. ESTIMATE,
#    NOT MEASURED: ~0.4 s for the 400-image set there, which is what docs/decisions.md D7
#    independently predicts and is small against 3-6 s of fixed startup. Nobody has run
#    this model on an H100. Do not quote the 4060 numbers as the submission's throughput.
model:
  name: NAFSR
  width: 48
  num_blocks: 16
  scale: 2                # F2: exactly x2, verified on all 3200 pairs
  in_ch: 1                # grayscale end to end, no BGR/RGB anywhere (V32)
  out_ch: 1
  dw_expand: 2            # NAFBlock spatial-branch expansion
  ffn_expand: 2           # NAFBlock channel-MLP expansion
  layerscale_init: 1.0    # official NAFNet uses 0.0; 1.0 converges faster on a 20k budget
data:
  lr_patch: 64            # -> 128 GT patch
  batch_size: 32
  synth_ratio: 0.5        # fraction generated on the fly from GT (SPEC F15)
  # Degradation params are MEASURED, not from SPEC 6.4. See docs/decisions.md D12.
  degrade:
    kernel: recovered_4x4       # bicubic_aa_off used for a minority of samples
    bicubic_alt_prob: 0.25
    noise_after_downsample: true
    a: 0.011253                 # shot / linear term
    v: 0.015745                 # speckle / quadratic term
    randomise_frac: 1.20        # widened +/-30% -> +/-120% to close F1 tail-coverage gap
                                 # (measured synthetic max 2.0869 vs real train max 2.0735)
    gauss_sigma_range: [0.0, 0.065]   # widened 0.02 -> 0.065, same F1 tail-coverage fix
    clip_lr: false              # SPEC F5 -- never clip synthetic LR
optim:
  optimizer: AdamW
  lr: 1.0e-3
  betas: [0.9, 0.9]       # NAFNet beta2=0.9, not 0.999
  weight_decay: 0.0
  scheduler: cosine
  min_lr: 1.0e-6
  warmup_iters: 500
  total_iters: 20000      # compressed for a 1-day budget
train:
  amp: bf16
  grad_clip: 1.0
  ema_decay: 0.999
  seed: 42
  channels_last: true
  val_every: 1000
  save_best_on: psnr
