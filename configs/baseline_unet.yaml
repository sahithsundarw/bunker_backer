# Plain U-Net learned baseline (SPEC 7.2 fallback row / SPEC 10 baseline 3, V28).
# Same data, loss, optimiser, schedule and iteration budget as configs/final.yaml so the
# only difference is the body -- otherwise the comparison measures the training budget,
# not the architecture.
#
# `name: UNetSR` is the frozen spelling in the build_model contract. The earlier spelling
# `UNetBaseline` is still accepted as an alias by src/model.py so old checkpoints load.
#
# MEASURED cost (src/model.py):
#   params 2,970,401 (2.970 M)   MACs @128x128 = 4.478 G   FLOPs ~= 8.96 G per image
# Against NAFSR w48 n16 (0.388 M / 11.17 GF) the baseline is ~7.7x the parameters and
# ~0.8x the FLOPs. The comparison is therefore roughly FLOP-matched, which is the fair
# axis for a throughput-scored task, and NAFSR is given no parameter advantage.
# Param-matched alternatives if a second baseline is wanted: w16 L4 = 0.743 M / 2.25 GF,
# w32 L3 = 0.757 M / 6.69 GF.
model:
  name: UNetSR
  width: 32
  levels: 4               # encoder-decoder depth; internal size multiple 2^(levels-1) = 8,
                          # reflect-padded and cropped inside forward() so the external
                          # requirement is still 1 (any H, W -> exactly 2H, 2W)
  scale: 2
  in_ch: 1
  out_ch: 1
data:
  lr_patch: 64
  batch_size: 32
  synth_ratio: 0.5
  degrade:
    kernel: recovered_4x4
    bicubic_alt_prob: 0.25
    noise_after_downsample: true
    a: 0.011253
    v: 0.015745
    randomise_frac: 1.20        # widened +/-30% -> +/-120% to close F1 tail-coverage gap
                                 # (measured synthetic max 2.0869 vs real train max 2.0735)
    gauss_sigma_range: [0.0, 0.065]   # widened 0.02 -> 0.065, same F1 tail-coverage fix
    clip_lr: false
optim:
  optimizer: AdamW
  lr: 1.0e-3
  betas: [0.9, 0.9]
  weight_decay: 0.0
  scheduler: cosine
  min_lr: 1.0e-6
  warmup_iters: 500
  total_iters: 20000
train:
  amp: bf16
  grad_clip: 1.0
  ema_decay: 0.999
  seed: 42
  channels_last: true
  val_every: 1000
  save_best_on: psnr
